<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的感恩手帳 📖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #FAF6EE;
      --card-bg: #FFFFFF;
      --primary-color: #D97736;
      --accent-color: #E28743;
      --text-main: #3D3A37;
      --text-sub: #7A746E;
      --quote-bg: #FFF8E7;
      --border-color: #EBDDCB;
      --selected-bg: #FFEAD2;
      --danger-color: #E05656;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 14px 40px;
      line-height: 1.6;
    }
    .container { max-width: 540px; margin: 0 auto; }

    .header {
      text-align: center;
      padding: 18px 14px;
      background: #FFFFFF;
      border-radius: 18px;
      border: 2px dashed var(--border-color);
      margin-bottom: 16px;
    }
    .header h1 { font-size: 22px; color: var(--primary-color); }
    .header p { font-size: 13px; color: var(--text-sub); margin-top: 3px; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #EFE7DB;
      padding: 6px;
      border-radius: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-sub);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .write-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 20px 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(184, 160, 137, 0.12);
      margin-bottom: 24px;
    }

    .today-date-bar {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 2px dashed #F2E5D5;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .picker-section { margin-bottom: 16px; }
    .picker-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .icon-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .select-pill {
      flex: 1;
      min-width: 60px;
      padding: 8px 4px;
      background: #FAF6EE;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .select-pill.active {
      background: var(--selected-bg);
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: scale(1.03);
    }

    .custom-mood-input {
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1.5px dashed var(--border-color);
      border-radius: 10px;
      outline: none;
      background-color: #FCFBF7;
      font-family: inherit;
    }
    .custom-mood-input:focus {
      border-color: var(--primary-color);
      background-color: #FFFFFF;
    }

    .three-things-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      margin: 18px 0 10px;
      padding-top: 14px;
      border-top: 2px dashed #F2E5D5;
    }
    .item-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FCFBF7;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .input-row:focus-within {
      border-color: var(--primary-color);
      background: #FFFFFF;
    }
    .row-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      min-width: 20px;
    }
    .input-row input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
    }

    .photo-upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      background: #FCFBF7;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 18px;
    }
    .photo-upload-box:hover {
      border-color: var(--primary-color);
      background: #FFFDF9;
    }
    .photo-preview-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin-top: 8px;
    }
    .photo-preview-img {
      max-height: 180px;
      width: auto;
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      object-fit: cover;
    }
    .photo-remove-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--danger-color);
      color: #FFF;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
