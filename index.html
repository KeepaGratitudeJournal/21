<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的感恩手帳 📖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CryptoJS AES 輕量級加密庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

  <style>
    :root {
      --bg-color: #FAF6EE;
      --card-bg: #FFFFFF;
      --primary-color: #D97736;
      --accent-color: #E28743;
      --text-main: #3D3A37;
      --text-sub: #7A746E;
      --quote-bg: #FFF8E7;
      --border-color: #EBDDCB;
      --selected-bg: #FFEAD2;
      --danger-color: #E05656;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 14px 40px;
      line-height: 1.6;
    }
    .container { max-width: 540px; margin: 0 auto; }

    .header {
      position: relative;
      text-align: center;
      padding: 18px 14px;
      background: #FFFFFF;
      border-radius: 18px;
      border: 2px dashed var(--border-color);
      margin-bottom: 16px;
    }
    .header h1 { font-size: 22px; color: var(--primary-color); }
    .header p { font-size: 13px; color: var(--text-sub); margin-top: 3px; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #EFE7DB;
      padding: 6px;
      border-radius: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-sub);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .write-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 20px 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(184, 160, 137, 0.12);
      margin-bottom: 24px;
    }

    .today-date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 2px dashed #F2E5D5;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .step-indicator {
      font-size: 13px;
      background: var(--quote-bg);
      color: var(--primary-color);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .picker-section { margin-bottom: 14px; }
    .picker-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .icon-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .select-pill {
      flex: 1;
      min-width: 60px;
      padding: 8px 4px;
      background: #FAF6EE;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .select-pill.active {
      background: var(--selected-bg);
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: scale(1.03);
    }

    .custom-mood-input {
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1.5px dashed var(--border-color);
      border-radius: 10px;
      outline: none;
      background-color: #FCFBF7;
      font-family: inherit;
    }
    .custom-mood-input:focus {
      border-color: var(--primary-color);
      background-color: #FFFFFF;
    }

    .photo-upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      background: #FCFBF7;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 14px;
    }
    .photo-upload-box:hover {
      border-color: var(--primary-color);
      background: #FFFDF9;
    }
    .photo-preview-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin-top: 8px;
    }
    .photo-preview-img {
      max-height: 180px;
      width: auto;
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      object-fit: cover;
    }
    .photo-remove-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--danger-color);
      color: #FFF;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .three-things-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 10px;
    }
    .item-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FCFBF7;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .input-row:focus-within {
      border-color: var(--primary-color);
      background: #FFFFFF;
    }
    .row-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      min-width: 20px;
    }
    .input-row input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .action-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary-color);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(217, 119, 54, 0.25);
    }
    .secondary-btn {
      width: 35%;
      background: #EFE7DB;
      color: var(--text-main);
      box-shadow: none;
    }
    .action-btn:disabled { background: #CCC; cursor: not-allowed; box-shadow: none; }

    .calendar-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 18px 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(184, 160, 137, 0.12);
      margin-bottom: 16px;
    }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .cal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-color);
    }
    .cal-nav-btn {
      background: #FAF6EE;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cal-day-num {
      font-size: 14px;
      color: var(--text-sub);
    }
    .cal-bubble {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border: 2px solid var(--primary-color);
      background-size: cover;
      background-position: center;
      transition: transform 0.2s;
    }
    .cal-bubble:hover {
      transform: scale(1.08);
    }
    .cal-bubble-day {
      position: absolute;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      z-index: 2;
    }
    .cal-bubble-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal-content {
      background: #FFFFFF;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      position: relative;
      border: 2px solid var(--border-color);
    }
    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #EFE7DB;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text-main);
    }
    .modal-photo {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>🌸 我的感恩日記本</h1>
      <p>🔒 私密加密保護 ｜ 免登入直接記錄溫暖回憶</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabWrite" onclick="switchView('write')">✍️ 寫今天日記</button>
      <button class="tab-btn" id="tabReview" onclick="switchView('review')">🗓️ 回顧月曆</button>
    </div>

    <main id="writeView">
      <section class="write-card">
        <div class="today-date-bar">
          <span id="displayDate">📅 載入今天日期...</span>
          <span class="step-indicator" id="stepIndicator">第 1 / 2 步</span>
        </div>

        <div id="page1">
          <div class="picker-section">
            <div class="picker-label">☀️ 今天的天氣：</div>
            <div class="icon-group" id="weatherGroup">
              <div class="select-pill active" onclick="selectWeather('☀️ 晴天')">☀️ 晴天</div>
              <div class="select-pill" onclick="selectWeather('⛅ 多雲')">⛅ 多雲</div>
              <div class="select-pill" onclick="selectWeather('🌧️ 雨天')">🌧️ 雨天</div>
              <div class="select-pill" onclick="selectWeather('🍃 微風')">🍃 微風</div>
            </div>
          </div>

          <div class="picker-section">
            <div class="picker-label">💖 今天的心情：</div>
            <div class="icon-group" id="moodGroup">
              <div class="select-pill active" onclick="selectPresetMood('😊 開心')">😊 開心</div>
              <div class="select-pill" onclick="selectPresetMood('🥰 幸福')">🥰 幸福</div>
              <div class="select-pill" onclick="selectPresetMood('😌 平靜')">😌 平靜</div>
              <div class="select-pill" onclick="selectPresetMood('💪 充實')">💪 充實</div>
            </div>
            <input type="text" id="customMood" class="custom-mood-input" placeholder="✏️
